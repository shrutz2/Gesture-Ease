name: Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
        
    - name: Deploy Backend Service
      run: |
        if aws ecs describe-services --cluster gesture-ease-cluster --services gesture-ease-service --region ap-south-1 --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
          aws ecs update-service --cluster gesture-ease-cluster --service gesture-ease-service --force-new-deployment --region ap-south-1
        else
          echo "Service gesture-ease-service not found. Create it first in AWS Console."
          exit 1
        fi
          
    - name: Deploy Frontend Service  
      run: |
        if aws ecs describe-services --cluster gesture-ease-cluster --services gesture-ease-frontend --region ap-south-1 --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
          aws ecs update-service --cluster gesture-ease-cluster --service gesture-ease-frontend --force-new-deployment --region ap-south-1
        else
          echo "Service gesture-ease-frontend not found. Create it first in AWS Console."
          exit 1
        fi
          
    - name: Deploy App Service
      run: |
        if aws ecs describe-services --cluster gesture-ease-cluster --services gesture-ease-app --region ap-south-1 --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
          aws ecs update-service --cluster gesture-ease-cluster --service gesture-ease-app --force-new-deployment --region ap-south-1
        else
          echo "Service gesture-ease-app not found. Create it first in AWS Console."
          exit 1
        fi