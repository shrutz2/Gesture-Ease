name: Build and Deploy to AWS (Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 000000000000
  ECR_BACKEND_REPOSITORY: gesture-ease-backend
  ECR_FRONTEND_REPOSITORY: gesture-ease-frontend
  ECS_CLUSTER: gesture-ease-cluster

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: private

    - name: Verify ECR Login
      run: |
        echo "ECR Registry: ${{ steps.login-ecr.outputs.registry }}"
        aws ecr describe-repositories --region ${{ env.AWS_REGION }} || echo "No repositories found"

    - name: Build and push backend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building backend image..."
        cd backend
        
        # Build image
        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest .
        
        # Push images
        echo "Pushing backend images..."
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
        
        echo "Backend build complete!"

    - name: Build and push frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building frontend image..."
        cd frontend
        
        # Build image
        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest .
        
        # Push images
        echo "Pushing frontend images..."
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
        
        echo "Frontend build complete!"

    - name: Deploy to ECS
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Creating ECS task definition..."
        
        cat > task-definition.json << EOF
        {
          "family": "gesture-ease-task",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "1024",
          "memory": "2048",
          "executionRoleArn": "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
          "containerDefinitions": [
            {
              "name": "backend",
              "image": "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG",
              "portMappings": [
                {
                  "containerPort": 5000,
                  "protocol": "tcp"
                }
              ],
              "essential": true,
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/gesture-ease-prod",
                  "awslogs-region": "${{ env.AWS_REGION }}",
                  "awslogs-stream-prefix": "backend"
                }
              }
            },
            {
              "name": "frontend",
              "image": "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG",
              "portMappings": [
                {
                  "containerPort": 80,
                  "protocol": "tcp"
                }
              ],
              "essential": true,
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/gesture-ease-prod",
                  "awslogs-region": "${{ env.AWS_REGION }}",
                  "awslogs-stream-prefix": "frontend"
                }
              }
            }
          ]
        }
        EOF
        
        echo "Registering task definition..."
        aws ecs register-task-definition --cli-input-json file://task-definition.json
        
        echo "Updating ECS service..."
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service gesture-ease-service \
          --task-definition gesture-ease-task \
          --force-new-deployment
        
        echo "Deployment complete!"

    - name: Deployment Status
      if: always()
      run: |
        echo "=== Deployment Summary ==="
        echo "Backend Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}"
        echo "Frontend Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}"
        echo "ECS Cluster: ${{ env.ECS_CLUSTER }}"
        echo "AWS Region: ${{ env.AWS_REGION }}"