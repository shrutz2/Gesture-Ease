name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: gesture-ease-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push backend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker build -t $ECR_REGISTRY/gesture-ease-backend:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/gesture-ease-backend:latest .
        docker push $ECR_REGISTRY/gesture-ease-backend:$IMAGE_TAG
        docker push $ECR_REGISTRY/gesture-ease-backend:latest

    - name: Build and push frontend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd frontend
        docker build -t $ECR_REGISTRY/gesture-ease-frontend:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/gesture-ease-frontend:latest .
        docker push $ECR_REGISTRY/gesture-ease-frontend:$IMAGE_TAG
        docker push $ECR_REGISTRY/gesture-ease-frontend:latest

    - name: Update backend service
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service gesture-ease-service \
          --force-new-deployment

    - name: Update frontend service
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service gesture-ease-frontend \
          --force-new-deployment

    - name: Update app service
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service gesture-ease-app \
          --force-new-deployment

    - name: Wait for deployment
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services gesture-ease-service gesture-ease-frontend gesture-ease-app